<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HSE OPS AI | NNPC Ltd HSE Platform</title>
    <meta name="description" content="AI-powered HSE operational support for NNPC Ltd — instant access to procedures, risk assessment tools, and safety guidance." />
    <meta name="theme-color" content="#008751" />
    <!-- Prevent flash of wrong theme -->

      (function () {
        try {
          if (localStorage.getItem('hse-ops-ai-theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
